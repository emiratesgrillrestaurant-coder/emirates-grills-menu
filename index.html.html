<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emirates Grills Menu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f3ed;color:#202020;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(92vw,460px);background:white;border-radius:24px;padding:38px 24px;box-shadow:0 12px 40px #0002;text-align:center;border-top:8px solid #415b5d}
.brand{font-size:30px;font-weight:800;letter-spacing:1px;color:#415b5d;margin:0}
.sub{margin:8px 0 30px;color:#666}
.btn{display:block;text-decoration:none;margin:15px 0;padding:19px 18px;border-radius:14px;font-weight:800;font-size:18px;letter-spacing:.4px}
.food{background:#415b5d;color:#fff}
.drinks{background:#111;color:#fff}
.dessert{background:#b52b32;color:#fff}
.small{font-size:12px;color:#888;margin-top:26px}
</style>
</head>
<body>
<main class="card">
  <h1 class="brand">EMIRATES GRILLS</h1>
  <div class="sub">Restaurant · Cafe · Pastries<br><strong>Select Your Menu</strong></div>
  <a class="btn food" href="https://drive.google.com/file/d/1Sq5FSw04koYPJu4GzbBhgCH5RiSBWnfu/view?usp=sharing">🍽 FOOD MENU</a>
  <a class="btn drinks" href="https://drive.google.com/file/d/1wvWiuyDQJD0_2H6jH55_HOzXAcb7-tS4/view?usp=sharing">🥤 DRINKS MENU</a>
  <a class="btn dessert" href="https://drive.google.com/file/d/15I5iPxb5o9v_TRTwwJga7VL6XanBCsp5/view?usp=sharing">🍰 DESSERT MENU</a>
  <div class="small">Tap a menu to view it</div>
</main>
</body>
</html>
